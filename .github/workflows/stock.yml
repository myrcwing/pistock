name: pi-stock
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python check_stock.py
      - run: |
          git config user.name "pistock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stock.json
          git diff --staged --quiet || git commit -m "update stock"
          git push
